<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API - Pencarian Lokasi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(1, 40, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(1, 60, 36, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #014925;
            margin-bottom: 8px;
        }

        .header h3 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: #04753c;
            letter-spacing: 0.5px;
        }

        hr {
            border: none;
            height: 1px;
            background: rgba(9, 70, 39, 0.36);
            margin: 20px 0;
        }

        .search {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            outline: none;
            font-size: 0.95rem;
            background: rgba(55, 94, 253, 0.6);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .search input::placeholder {
            color: #0d2d59;
        }

        .search input:focus {
            border-color: #0a6c3e;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(2, 65, 39, 0.2);
        }

        .search button {
            background: linear-gradient(135deg, #63f18b 0%, #91cd3d 100%);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(7, 125, 39, 0.4);
        }

        .search button:hover {
            opacity: 0.9;
        }

        .search button:active {
            transform: scale(0.96);
        }

        #status {
            text-align: center;
            font-size: 0.85rem;
            color: #38f86e;
            margin-bottom: 15px;
            font-weight: 500;
            min-height: 20px;
        }

        #hasil {
            background: rgba(45, 214, 90, 0.5);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lokasi-title {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .lokasi-title small {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #61e27b;
            font-weight: 700;
        }

        .lokasi-title h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 4px;
            font-weight: 700;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(69, 67, 67, 0.05);
        }

        .row:last-child {
            border-bottom: none;
        }

        .row span:first-child {
            color: #94a3b8;
            font-weight: 500;
        }

        .row span:last-child {
            color: #f1f5f9;
            font-weight: 600;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">PWS Weather API</div>
            <h3>Radiva Septiana Marcelita</h3>
            <p>20240140117</p>
        </div>
        <hr>
        <div class="search">
            <input type="text" id="input-lokasi" placeholder="Cari lokasi... ">
            <button id="btn-cari">Search</button>
        </div>

        <div id="status"></div>

        <div id="hasil">
            <div class="lokasi-title">
                <small>Lokasi</small>
                <h2 id="lokasi">-</h2>
            </div>
            <div class="row"><span>Negara</span><span id="negara">-</span></div>
            <div class="row"><span>Provinsi</span><span id="provinsi">-</span></div>
            <div class="row"><span>Kecamatan</span><span id="kecamatan">-</span></div>
            <div class="row"><span>Longitude</span><span id="longitude">-</span></div>
            <div class="row"><span>Latitude</span><span id="latitude">-</span></div>
        </div>
    </div>
        
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        const API_KEY = "RlGrXLDS5niF5gx1M3PE";

        function cariWilayah(feature, tipe) {
            if (feature.place_type && feature.place_type.some(t => tipe.includes(t))) {
                return feature.text;
            }
            if (feature.context) {
                for (const c of feature.context) {
                    const prefix = c.id.split(".")[0];
                    if (tipe.includes(prefix)) return c.text;
                }
            }
            return "-";
        }

        function cariKecamatan(f) {
            $("#kecamatan").text("Mencari...");
            const lon = f.center[0];
            const lat = f.center[1];

            const prioritas = [
                "municipal_district",
                "joint_submunicipality",
                "municipality",
                "joint_municipality",
                "locality",
                "neighbourhood"
            ];

            function pilih(daftar) {
                for (const tipe of prioritas) {
                    const hit = daftar.find(x => x.id && x.id.split(".")[0] === tipe);
                    if (hit) return hit.text;
                }
                return null;
            }

            const awal = [f].concat(f.context || []);
            const dariAwal = pilih(awal);
            if (dariAwal) {
                $("#kecamatan").text(dariAwal);
                return;
            }

            $.ajax({
                url: "https://api.maptiler.com/geocoding/" + lon + "," + lat + ".json?key=" + API_KEY + "&language=id",
                method: "GET",
                success: function (data) {
                    const semua = [];
                    data.features.forEach(x => {
                        semua.push(x);
                        (x.context || []).forEach(c => semua.push(c));
                    });
                    $("#kecamatan").text(pilih(semua) || "-");
                },
                error: function (error) {
                    console.log(error);
                    $("#kecamatan").text("-");
                }
            });
        }

        function cari() {
            const kota = $("#input-lokasi").val().trim();
            if (!kota) {
                $("#status").text("Masukkan nama lokasi dulu ya.");
                return;
            }

            $("#status").text("Mencari data...");

            const urlapi = "https://api.maptiler.com/geocoding/" + encodeURIComponent(kota) + ".json?key=" + API_KEY + "&language=id&limit=1";

            $.ajax({
                url: urlapi,
                method: "GET",
                success: function (data) {
                    if (!data.features || data.features.length === 0) {
                        $("#status").text("Lokasi tidak ditemukan.");
                        return;
                    }

                    const f = data.features[0];
                    $("#lokasi").text(f.matching_text || f.text || f.place_name);
                    $("#negara").text(cariWilayah(f, ["country"]));
                    $("#provinsi").text(cariWilayah(f, ["region"]));
                    cariKecamatan(f);
                    $("#longitude").text(f.center[0]);
                    $("#latitude").text(f.center[1]);

                    $("#status").text("");
                },
                error: function (error) {
                    console.log(error);
                    $("#status").text("Gagal mengambil data API.");
                }
            });
        }

        $("#btn-cari").on("click", cari);
        $("#input-lokasi").on("keypress", function (e) {
            if (e.key === "Enter") cari();
        });
    </script>
</body>
</html>
